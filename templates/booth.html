<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth</title>
<style>
  :root {
    --bg: #0E0F12; --text: #ECEDEE; --muted: #9BA0A8; --secondary: #B4B9C1;
    --card: #17191E; --border: #262A31; --radius: 16px;
    --accent: #F5A524; --warn: #FF8A4C; --next: #5BC0EB;
    --body-font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --num-font: "Space Grotesk", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body-font); }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .num { font-family: var(--num-font); font-variant-numeric: tabular-nums; }

  #conn { display: none; color: var(--warn); font-size: 14px; text-align: center; }
  #conn.on { display: block; }

  #decks { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start; }
  .deck { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: clamp(16px, 2vw, 28px); display: flex; flex-direction: column; gap: clamp(8px, 1.2vw, 16px); min-width: 0; }
  .deck[hidden] { display: none; }
  .deck .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .deck .letter { font-family: var(--num-font); font-weight: 700; letter-spacing: .12em; color: var(--secondary); font-size: clamp(14px, 1.4vw, 20px); }
  .deck .state { font-weight: 700; letter-spacing: .12em; font-size: clamp(14px, 1.4vw, 20px); color: var(--muted); }
  .deck .title { font-family: var(--num-font); font-weight: 600; font-size: clamp(22px, 3vw, 44px); line-height: 1.1;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck .artist { font-size: clamp(16px, 1.8vw, 26px); color: var(--secondary); min-height: 1.2em;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck .count { font-family: var(--num-font); font-variant-numeric: tabular-nums; font-weight: 700; line-height: 1;
                 font-size: clamp(56px, 8.5vw, 150px); color: var(--muted); white-space: nowrap; }
  .deck .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .deck .times { color: var(--muted); font-size: clamp(16px, 1.8vw, 26px); }
  .deck .tech { display: flex; gap: clamp(14px, 2vw, 32px); font-size: clamp(20px, 2.6vw, 40px); font-weight: 600; }
  .deck .tech small { color: var(--muted); font-size: .5em; font-weight: 500; letter-spacing: .08em; margin-left: .3em; }
  .deck .bar { height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; }
  .deck .fill { height: 100%; width: 0; background: var(--muted); }
  .deck .note { min-height: 1.3em; font-size: clamp(14px, 1.4vw, 20px); color: var(--muted); }
  .deck .empty-label { display: none; color: var(--muted); font-size: clamp(22px, 3vw, 40px); padding: 24px 0; text-align: center; }

  .deck.playing .state, .deck.playing .count, .deck.stale .state, .deck.stale .count { color: var(--accent); }
  .deck.playing .fill, .deck.stale .fill { background: var(--accent); }
  .deck.warn .count { color: var(--warn); }
  .deck.warn .fill { background: var(--warn); }
  .deck.stale .body { opacity: .45; }
  .deck.stale .note { color: var(--warn); font-weight: 600; }
  .deck.empty .body { display: none; }
  .deck.empty .empty-label { display: block; }
  .deck.empty .state { visibility: hidden; }

  #next { background: var(--card); border: 1px solid var(--border); border-left: 6px solid var(--next);
          border-radius: var(--radius); padding: clamp(12px, 1.6vw, 22px) clamp(16px, 2vw, 28px);
          display: flex; align-items: baseline; gap: clamp(12px, 2vw, 32px); flex-wrap: wrap; }
  #next .label { color: var(--next); font-weight: 700; letter-spacing: .12em; font-size: clamp(14px, 1.4vw, 20px); }
  #next .who { flex: 1; min-width: 0; }
  #next .ntitle { font-family: var(--num-font); font-weight: 600; font-size: clamp(20px, 2.4vw, 34px);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next .nartist { color: var(--secondary); font-size: clamp(14px, 1.5vw, 22px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next .facts { display: flex; gap: clamp(14px, 2vw, 32px); font-size: clamp(18px, 2.2vw, 32px); font-weight: 600; }
  #next .facts small { color: var(--muted); font-size: .5em; font-weight: 500; letter-spacing: .08em; margin-left: .3em; }
  #next.none .who .ntitle { color: var(--muted); font-weight: 500; }
  #next.none .facts { display: none; }
  #tools { text-align: right; min-height: 0; }
  #resetDecks { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px;
                padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  #resetDecks:hover { color: var(--text); border-color: var(--muted); }
  #resetDecks[hidden] { display: none; }

  /* three or four decks loaded: smaller type so everything, including Up Next, still fits */
  #decks.many { gap: 12px; }
  #decks.many .deck { padding: 14px 18px; gap: 6px; }
  #decks.many .title { font-size: clamp(18px, 2.1vw, 30px); }
  #decks.many .artist { font-size: clamp(14px, 1.4vw, 20px); }
  #decks.many .count { font-size: clamp(40px, 5.2vw, 96px); }
  #decks.many .times { font-size: clamp(14px, 1.4vw, 20px); }
  #decks.many .tech { font-size: clamp(16px, 1.9vw, 28px); }
  #decks.many .note { min-height: 1.1em; }

  @media (max-width: 760px) {
    #decks { grid-template-columns: minmax(0, 1fr); }
    #next .facts { flex-basis: 100%; }
  }
</style>
</head>
<body>
  <div id="conn">Reconnecting to server&hellip;</div>
  <main id="decks"></main>
  <footer id="next" class="none">
    <span class="label">UP NEXT</span>
    <div class="who"><div class="ntitle">Queue empty</div><div class="nartist"></div></div>
    <div class="facts num"><span><span id="nbpm">&mdash;</span><small>BPM</small></span><span><span id="nlen">&mdash;</span><small>LENGTH</small></span></div>
  </footer>
  <div id="tools"><button id="resetDecks" hidden title="Forget the deck state shown here">Reset decks</button></div>

<script>
(function () {
  'use strict';
  const DECKS = ['A', 'B', 'C', 'D'];
  const WARN_UNDER = 30;
  let snap = null;      // latest traktor_state snapshot
  let rxAt = 0;         // performance.now() when it arrived
  const els = {};

  const $ = (sel, root) => (root || document).querySelector(sel);
  function setText(node, value) { if (node._v !== value) { node._v = value; node.textContent = value; } }
  function setClass(el, name, on) { el.classList.toggle(name, !!on); }
  const mmss = (sec) => { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const stem = (name) => (name || '').replace(/\.[^.\\/]+$/, '');

  function build() {
    const grid = $('#decks');
    DECKS.forEach((id) => {
      const root = document.createElement('section');
      root.className = 'deck empty';
      root.hidden = id === 'C' || id === 'D';
      root.innerHTML =
        '<div class="head"><span class="letter">DECK ' + id + '</span><span class="state"></span></div>' +
        '<div class="empty-label">Empty</div>' +
        '<div class="body">' +
          '<div class="title"></div><div class="artist"></div>' +
          '<div class="count num"></div>' +
          '<div class="row"><span class="times num"></span>' +
            '<span class="tech num"><span><span class="bpm"></span><small>BPM</small></span><span><span class="key"></span><small>KEY</small></span></span></div>' +
          '<div class="bar"><div class="fill"></div></div>' +
        '</div>' +
        '<div class="note"></div>';
      grid.appendChild(root);
      els[id] = { root, state: $('.state', root), title: $('.title', root), artist: $('.artist', root),
                  count: $('.count', root), times: $('.times', root), bpm: $('.bpm', root), key: $('.key', root),
                  fill: $('.fill', root), note: $('.note', root) };
    });
  }

  // Server time "now", extrapolated from when the snapshot arrived.
  const serverNow = () => snap.server_time + (performance.now() - rxAt) / 1000;

  // Mirrors traktor.state.deck_status. The server sends the thresholds in the snapshot.
  function status(d, now) {
    if (!d.file_name) return 'empty';
    if (!d.is_playing) return 'paused';
    const age = d.updated_at == null ? Infinity : now - d.updated_at;
    if (age > snap.lost_after) return 'paused';
    return age > snap.stale_after ? 'stale' : 'playing';
  }

  function shownElapsed(d, st, now) {
    const tempo = d.tempo || 1;
    let e = d.elapsed || 0;
    if (d.elapsed_at != null) {
      if (st === 'playing') e += Math.max(0, now - d.elapsed_at) * tempo;
      else if (st === 'stale') e += Math.max(0, d.updated_at + snap.stale_after - d.elapsed_at) * tempo;  // frozen where it went quiet
    }
    return d.track_length ? Math.min(e, d.track_length) : e;
  }

  function renderDeck(id, now) {
    const d = snap.decks[id], el = els[id], st = status(d, now);
    const empty = st === 'empty';
    el.root.hidden = empty && (id === 'C' || id === 'D');
    ['empty', 'paused', 'playing', 'stale'].forEach((c) => setClass(el.root, c, c === st));
    setText(el.state, st === 'playing' || st === 'stale' ? 'PLAYING' : st === 'paused' ? 'PAUSED' : '');
    if (empty) { setText(el.note, ''); return; }

    setText(el.title, d.title || stem(d.file_name));
    setText(el.artist, d.artist || '');
    const tempo = d.tempo || 1, len = d.track_length || 0;
    const e = shownElapsed(d, st, now);
    const remaining = len ? (len - e) / tempo : null;
    setText(el.count, remaining == null ? '−:−−' : '−' + mmss(Math.ceil(remaining)));
    setText(el.times, len ? mmss(e) + ' / ' + mmss(len) : mmss(e));
    setText(el.bpm, d.bpm ? (d.bpm * tempo).toFixed(1) : '—');
    setText(el.key, d.key || '—');
    const pct = len ? Math.min(100, Math.max(0, (e / len) * 100)) : 0;
    const w = pct.toFixed(2) + '%';
    if (el.fill._v !== w) { el.fill._v = w; el.fill.style.width = w; }
    setClass(el.root, 'warn', st === 'playing' && remaining != null && remaining < WARN_UNDER);
    setText(el.note, st === 'stale' ? 'Traktor signal lost' : d.restored ? 'restored' : '');
  }

  function frame() {
    if (snap) {
      const now = serverNow();
      DECKS.forEach((id) => renderDeck(id, now));
      setClass($('#decks'), 'many', DECKS.filter((id) => !els[id].root.hidden).length > 2);
      // offer a reset only when something lingers: a restored deck, or one whose signal went quiet
      $('#resetDecks').hidden = !DECKS.some((id) => snap.decks[id].restored || status(snap.decks[id], now) === 'stale');
    }
    requestAnimationFrame(frame);
  }

  // ---- Up Next: the next ready track of tonight's queue (lowest position, not yet loaded or played) ----
  function renderNext(state) {
    const box = $('#next');
    const next = state && state.up_next;
    const pending = state && state.items.some((i) => i.status === 'queued' || i.status === 'downloading');
    box.classList.toggle('none', !next);
    setText($('.ntitle', box), next ? next.title : pending ? 'Getting the next track ready…' : 'Queue empty');
    setText($('.nartist', box), next ? next.artist : '');
    setText($('#nbpm'), next && next.bpm ? (Math.round(next.bpm * 10) / 10).toFixed(1) : '—');
    setText($('#nlen'), next && next.length_s ? mmss(next.length_s) : '—');
  }
  async function fetchQueue() {
    try { renderNext(await (await fetch('/api/queue_items')).json()); } catch (e) { /* keep what is shown */ }
  }

  function take(state) { snap = state; rxAt = performance.now(); }
  // ?poll uses plain polling instead of the SSE stream (for proxies that block SSE, and for screenshots).
  function poll() {
    const tick = () => fetch('/api/traktor/state').then((r) => r.json()).then(take).then(fetchQueue).catch(() => {});
    tick();
    setInterval(tick, 500);
  }
  function connect() {
    if (new URLSearchParams(location.search).has('poll')) return poll();
    const es = new EventSource('/api/events');
    es.onopen = () => $('#conn').classList.remove('on');
    es.onerror = () => $('#conn').classList.add('on');
    es.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.event === 'traktor_state') take(m.state);
      else if (m.event === 'queue_update' || m.event === 'download_complete' || m.event === 'download_failed') fetchQueue();
    };
  }

  build();
  $('#resetDecks').addEventListener('click', () => fetch('/api/traktor/reset', { method: 'POST' }).then(() => {
    fetch('/api/traktor/state').then((r) => r.json()).then(take).catch(() => {});
  }).catch(() => {}));
  fetch('/api/traktor/state').then((r) => r.json()).then((s) => { if (!snap) take(s); }).catch(() => {});
  connect();
  fetchQueue();
  setInterval(fetchQueue, 5000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
